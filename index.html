<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualização Folha de Pagamento</title>
</head>

<body>
    <div class="title">
        <hr>
        <h1>
            Automação para Atualização de folha de pagamento
        </h1>
        <hr>
    </div>

    <div class="uploads">
        <label for="uploadOrigem">Adicione aqui a planilha dos dados de origem</label>
        <input type="file" class="uploadOrigem" id="uploadOrigem">
        <label for="uploadDestino">Adicione aqui a planilha dos dados de destino</label>
        <input type="file" class="uploadDestino" id="uploadDestino">
        
    </div>
    <div class="logs">
        <h2>Progresso e avisos</h2>
        <div class="caixaLogs" id="caixaLogs">
        
        </div>
        <div class="processar">
            <button class="btnProcessar" id="btnProcessar">Processar</button>
        </div>
    </div>
    <div class="download">
        <button class="btnDownload" id="btnDownload" disabled>Baixe aqui a planilha</button>
    </div>

    <div class="modal oculto" id="modal">
        <div class="modalConteudo">
            <h2>Aviso</h2>
            <div class="modalMensagem" id="modalMensagem">
                <!-- Mensagem será inserida aqui -->
            </div>
            <div class="modalBotoes">
                <button class="btnAtualizar" id="btnAtualizar">Atualizar</button>
                <button class="btnCancelar" id="btnCancelar">Cancelar</button>
            </div>
        </div>
        
    </div>
    <div class="modal oculto" id="modalNaoEncontrados">
        <div class="modalConteudo">
            <h2>Não encontrados</h2>
            <div class="modalMensagem" id="modalMensagemNaoEncontrados">
                <!-- Nomes serão inseridos aqui -->
            </div>
            <div class="modalBotoes">
                <button class="btnOk" id="btnOk">OK</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="formatData.js"></script>
    <script src="formatFiles.js"></script>
    <script src="compare.js"></script>
    <script src="update.js"></script>
    <script src="main.js"></script>
</body>



</html>
